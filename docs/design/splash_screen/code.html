<script>
    (function () {
      const progressBar = document.getElementById('splash-progress-bar');
      const progressText = document.getElementById('splash-progress-counter');
      const statusText = document.getElementById('splash-status-text');

      const statusStages = [
        { at: 15, text: "Verifying Node Credentials..." },
        { at: 45, text: "Handshaking Dispatch Engine..." },
        { at: 75, text: "Syncing Engineer Telemetry..." },
        { at: 92, text: "Secure Session Established" }
      ];

      requestAnimationFrame(() => {
        if (progressBar) {
          progressBar.style.width = '100%';
        }
      });

      const startTime = performance.now();
      const totalDuration = 2000;

      function updateCounter(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(Math.round((elapsed / totalDuration) * 100), 100);

        if (progressText) {
          progressText.textContent = progress + '%';
        }

        if (statusText) {
          for (let i = statusStages.length - 1; i >= 0; i--) {
            if (progress >= statusStages[i].at) {
              statusText.textContent = statusStages[i].text;
              break;
            }
          }
        }

        if (progress < 100) {
          requestAnimationFrame(updateCounter);
        }
      }

      requestAnimationFrame(updateCounter);
    })();
